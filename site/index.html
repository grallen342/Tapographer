<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapographer</title>
<meta name="description" content="Tap the globe where you think each place is. Five places, rising difficulty, up to 1,000 points.">
<meta name="theme-color" content="#04070D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -26 20 27'%3E%3Cpath d='M0,0 C-2,-6 -9,-10 -9,-17 A9,9 0 1 1 9,-17 C9,-10 2,-6 0,0Z' fill='%23FF7A45'/%3E%3Ccircle cx='0' cy='-17' r='3.4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/polish.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<main id="stage">
  <canvas id="globe" aria-label="Globe. Drag to spin, pinch or scroll to zoom, tap to drop a pin."></canvas>
  <svg id="pins" aria-hidden="true"></svg>

  <header class="top" id="top">
    <div class="bar">
      <div class="brand">
        <svg width="18" height="22" viewBox="-10 -26 20 27" aria-hidden="true"><path d="M0,0 C-2,-6 -9,-10 -9,-17 A9,9 0 1 1 9,-17 C9,-10 2,-6 0,0Z" fill="var(--accent)"/><circle cx="0" cy="-17" r="3.4" fill="#fff"/></svg>
        Tapographer
      </div>
      <div class="navbtns">
        <button class="nb" id="nb-rank" aria-label="Rankings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2h8v4a4 4 0 0 1-8 0V2Z"/><path d="M4 3H2v1.5A2.5 2.5 0 0 0 4.5 7M12 3h2v1.5A2.5 2.5 0 0 1 11.5 7M8 10v3M5 14h6"/></svg><span class="lbl">Rankings</span></button>
        <button class="nb" id="nb-duel" aria-label="Duels"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l7 7M2 2h3M2 2v3M14 2l-7 7M14 2h-3M14 2v3M5 9l-2 2 2 2 2-2M11 9l2 2-2 2-2-2"/></svg><span class="lbl">Duels</span><span class="badge" id="duelbadge" hidden>0</span></button>
        <button class="nb" id="nb-admin" hidden aria-label="Host control panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg><span class="lbl">Host</span></button>
        <button class="nb me-chip" id="nb-me" aria-label="Your profile"><span class="av" id="meav">🧭</span><span class="lbl" id="mename">Log in</span><span class="rpill" id="merating" hidden></span></button>
      </div>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="Game mode"></nav>
    <div class="announce" id="announce" hidden></div>
  </header>

  <section class="prompt" id="prompt" aria-live="polite">
    <div class="ptop">
      <span class="roundlbl" id="roundlbl">Round 1 / 5</span>
      <span class="rtag" id="rtag">Ranked</span>
      <span class="vs" id="vs" hidden></span>
      <span class="score"><b id="total">0</b><small id="outof">/ 1000</small></span>
    </div>
    <div class="place" id="place">&nbsp;</div>
    <div class="ctx"><span class="kind" id="kind"></span><span id="ctx">&nbsp;</span></div>
    <div class="steps" id="dots" aria-hidden="true"></div>
    <div class="timer" id="timer" hidden><i id="timerbar"></i></div>
  </section>

  <div class="zoomctl" id="zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
  </div>

  <div class="dock" id="dock">
    <div class="result" id="result" hidden>
      <div class="rhead">
        <div class="rscore"><span class="rpts" id="rpts"></span><span class="rmath" id="rmath"></span></div>
        <div class="rmid"><div class="verdict" id="verdict"></div><div class="rdist" id="rdist"></div></div>
        <span class="remoji" id="remoji"></span>
      </div>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <div class="story" id="story"></div>
    </div>
    <button id="action" disabled>Tap the globe to drop a pin</button>
  </div>

  <div class="overlay" id="summary" hidden>
    <div class="card sumcard" role="dialog" aria-labelledby="sumh">
      <div class="sumscroll">
        <div class="sumhead">
          <h2 id="sumh">Final score</h2>
          <div class="big"><span class="n" id="sumn">0</span><span class="of" id="sumof">/ 1000</span></div>
          <div class="grade" id="grade"></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="stats" id="stats"></div>
        <div id="duelres"></div>
        <ul class="rows" id="rows"></ul>
        <div class="share" id="sharetext"></div>
      </div>
      <div class="btns sumfoot">
        <button class="secondary" id="copy">Copy result</button>
        <button class="primary" id="again">Play again</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="sheet" hidden>
    <div class="card" role="dialog" aria-labelledby="sheettitle">
      <div class="sheethead"><h3 id="sheettitle">Rankings</h3><button class="x" id="sheetx" aria-label="Close">&times;</button></div>
      <div id="sheetbody" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </div>

  <div class="overlay auth" id="auth" hidden>
    <div class="card authcard" id="authcard" role="dialog" aria-label="Log in or create an account"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="loading" id="loading"><span class="loadpin" aria-hidden="true"></span><span id="loadmsg">Loading the map…</span></div>
</main>

<script src="js/data.js"></script>
<script src="js/globe.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
