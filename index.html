<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapographer Host</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04070D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -26 20 27'%3E%3Cpath d='M0,0 C-2,-6 -9,-10 -9,-17 A9,9 0 1 1 9,-17 C9,-10 2,-6 0,0Z' fill='%23FF7A45'/%3E%3Ccircle cx='0' cy='-17' r='3.4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/polish.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="adminpage">
  <header class="hostbar" id="hostbar" hidden>
    <div class="authbrand"><span class="pinmark"></span>Tapographer <span class="hosttag">Host</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Control panel sections">
      <button role="tab" data-tab="overview">Overview</button>
      <button role="tab" data-tab="players">Players</button>
      <button role="tab" data-tab="duels">Duels</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="hostright">
      <span class="who" id="hostname"></span>
      <button class="secondary small" id="refresh">Refresh</button>
      <button class="secondary small" id="lock">Lock</button>
      <a class="secondary small btnlink" href="./">Game</a>
    </div>
  </header>

  <main class="panel" id="panel" hidden>
    <div id="panelbody"></div>
  </main>

  <div class="gate" id="gate" hidden>
    <div class="card authcard" id="gatecard"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="js/admin.js"></script>
</body>
</html>
